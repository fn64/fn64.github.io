name: Pages

on:
  push:
    branches: [main]
    paths:
      # Globs, not individual files: how-it-works.html was previously missing
      # from this list, so edits to it alone never triggered a deploy.
      - "*.html"
      - "*.css"
      - "*.svg"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate site
        run: python3 scripts/lint-site.py
      - name: Stage published files
        # design/ holds working explorations, not part of the published site.
        run: |
          set -euo pipefail
          mkdir -p _site
          cp *.html *.css *.svg .nojekyll _site/
          ls -la _site
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
