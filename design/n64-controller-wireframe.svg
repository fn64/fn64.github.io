<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none" stroke="#5b6774" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <!-- N64 controller: three-prong (trident) silhouette as ONE continuous outline.
       Left grip, center prong (hangs lowest), right grip. Traced to reference layout. -->

  <path d="
    M 96 60
    Q 150 44 170 44
    Q 190 44 224 60
    L 268 56
    Q 292 56 296 80
    L 300 120
    Q 302 152 276 158
    Q 252 162 244 140
    L 226 104
    Q 220 96 212 98
    Q 190 108 190 130
    L 194 182
    Q 196 200 178 202
    L 142 202
    Q 124 200 126 182
    L 130 130
    Q 130 108 108 98
    Q 100 96 94 104
    L 76 140
    Q 68 162 44 158
    Q 18 152 20 120
    L 24 80
    Q 28 56 52 56
    L 96 60 Z"/>

  <!-- L / R shoulder ridge lines -->
  <path d="M 52 56 Q 40 60 36 76" stroke-width="1.4"/>
  <path d="M 268 56 Q 280 60 284 76" stroke-width="1.4"/>

  <!-- Left grip: D-pad (plus + square hub) -->
  <g stroke-width="1.6">
    <path d="M 58 94 h 26 M 71 81 v 26"/>
    <rect x="65" y="88" width="12" height="12" rx="1.5"/>
  </g>

  <!-- Center prong: Start above, analog stick below -->
  <g stroke-width="1.6">
    <circle cx="160" cy="92" r="6.5"/><!-- Start -->
    <circle cx="160" cy="140" r="18"/><!-- stick collar -->
    <circle cx="160" cy="140" r="7.5"/><!-- stick top -->
  </g>

  <!-- Right grip: C diamond (4), A large + B upper-left -->
  <g stroke-width="1.6">
    <circle cx="254" cy="80" r="4.5"/><!-- C-up -->
    <circle cx="240" cy="94" r="4.5"/><!-- C-left -->
    <circle cx="268" cy="94" r="4.5"/><!-- C-right -->
    <circle cx="254" cy="108" r="4.5"/><!-- C-down -->
    <circle cx="230" cy="124" r="8"/><!-- A (large) -->
    <circle cx="212" cy="110" r="5.5"/><!-- B (upper-left of A) -->
  </g>
</svg>
