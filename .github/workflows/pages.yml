name: Pages

on:
  push:
    branches: [main]
    paths:
      # Globs, not individual files: how-it-works.html was previously missing
      # from this list, so edits to it alone never triggered a deploy.
      - "*.html"
      - "*.css"
      - "*.svg"
      - "*.png"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check styles.css is up to date
        # styles.css is a committed build artifact, so it can drift if someone
        # edits markup or src/app.css without rebuilding. Rebuild here and fail
        # on any difference rather than deploying stale CSS.
        #
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i src/app.css -o /tmp/styles.css --minify
          if ! diff -q /tmp/styles.css styles.css; then
            echo "::error::styles.css is stale. Run the build and commit the result (see CLAUDE.md)."
            diff /tmp/styles.css styles.css | head -40 || true
            exit 1
          fi
      - name: Validate site
        run: python3 scripts/lint-site.py
      - name: Stage published files
        # design/ holds working explorations, not part of the published site.
        run: |
          set -euo pipefail
          mkdir -p _site
          cp *.html *.css *.svg *.png .nojekyll _site/
          ls -la _site
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
